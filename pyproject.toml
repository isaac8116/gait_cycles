[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitbench"
version = "0.1.0"
description = "Test harness for comparing open-source gait event and cycle tools on the same clips"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Video reading, the labelling tool and video overlays.
# opencv-python, opencv-python-headless (required by myogait) and opencv-contrib-python (required
# by mediapipe) all install the same cv2; whichever pip installs last wins. If it is the headless
# one, `gaitbench label` cannot open a window. Repair after installing the myogait/pose extras,
# without uninstalling anything (the packages share files):
#   pip install --force-reinstall --no-deps opencv-python==<installed version>
# `gaitbench env` checks for this and prints the exact command.
video = ["opencv-python>=4.8"]
# myogait pipeline + gaitkit detectors (pinned: see docs/open-source-evaluation-plan.md, E6).
myogait = ["myogait==0.9.1", "gaitkit==1.4.9"]
# CPU pose backends run through myogait. RTMW models download from openmmlab.com on first use.
pose = ["myogait[mediapipe,rtmw]==0.9.1"]
# Intel RealSense D455 capture. No official macOS wheel exists; on Apple Silicon the
# community wheel `pyrealsense2-macosx` is used instead (see docs/harness.md). Its only release
# that meets the pin, 2.56.5, ships macosx_15_0_arm64 wheels only (no sdist), so this extra needs
# macOS 15 (Sequoia) or later: on macOS 13/14 pip finds no matching distribution. Alternatives
# there: conda-forge's build (`conda install -c conda-forge pyrealsense2`; macOS 11+, Apple Silicon
# and Intel, Python 3.11-3.14), or `pip install pyrealsense2-macosx==2.54.2` (macOS 12+ universal2
# wheels, Python <= 3.12 only; it records ROS1 .bag files, which the readers handle).
realsense = [
    "pyrealsense2>=2.56; sys_platform != 'darwin'",
    "pyrealsense2-macosx>=2.56; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=7.4"]

[project.scripts]
gaitbench = "gaitbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "myogait: needs myogait and gaitkit installed",
    "video: needs opencv installed",
    "slow: downloads a model or runs a pose backend; deselect with -m 'not slow'",
]
